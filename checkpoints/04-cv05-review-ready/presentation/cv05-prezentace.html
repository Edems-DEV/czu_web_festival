<blockquote>
<p><em>„AI asistent navrhl nahradit testování scénářů regulárním výrazem – zásadně jsme to odmítli.“</em></p>

<h3 id="k-%C4%8Demu-jsme-ai-vyu%C5%BEili">K čemu jsme AI využili:</h3>

<h3 id="zji%C5%A1t%C4%9Bn%C3%A1-halucinace-a-neakceptovateln%C3%BD-p%C5%99%C3%ADstup-ai">Zjištěná halucinace a neakceptovatelný přístup AI:</h3>
