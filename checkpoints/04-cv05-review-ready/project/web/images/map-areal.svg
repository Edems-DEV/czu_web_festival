<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" fill="none" role="img" aria-label="Orientační plánek areálu Výstaviště Praha se třemi scénami a bezbariérovými trasami">
  <defs>
    <style>
      .label-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 800; fill: #f8fafc; }
      .label-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #94a3b8; }
      .legend-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
    </style>
  </defs>
  <!-- Background Campus Grid -->
  <rect width="900" height="550" fill="#0b0f19" rx="16"/>
  <rect x="20" y="20" width="860" height="510" fill="#131c2e" rx="12" stroke="#2d3748" stroke-width="2"/>
  <!-- Grass / Park areas -->
  <path d="M40 40 L 400 40 L 400 180 L 180 180 L 40 300 Z" fill="#064e3b" opacity="0.25" rx="8"/>
  <path d="M500 40 L 860 40 L 860 220 L 620 220 L 500 140 Z" fill="#064e3b" opacity="0.25" rx="8"/>
  <!-- Accessible Promenade & Paved Paths -->
  <path d="M80 490 L 80 320 L 260 320 L 260 140 L 450 140 L 450 360 L 680 360 L 680 180 L 820 180" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <path d="M80 490 L 80 320 L 260 320 L 260 140 L 450 140 L 450 360 L 680 360 L 680 180 L 820 180" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/>
  
  <!-- STAGE 1: Aurora Main Stage (v1) -->
  <g transform="translate(420, 40)">
    <rect width="240" height="130" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="15" y="15" width="210" height="32" rx="6" fill="#0284c7"/>
    <text x="120" y="36" text-anchor="middle" class="label-title">AURORA MAIN STAGE</text>
    <text x="120" y="68" text-anchor="middle" class="label-sub">Kapacita: 7 000 osob (Open-Air)</text>
    <rect x="25" y="82" width="190" height="34" rx="6" fill="#0b0f19" stroke="#2d3748"/>
    <text x="120" y="103" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">♿ Bezbariérová rampa + ZTP tribuna</text>
  </g>

  <!-- STAGE 2: Riverside Club Stage (v2) -->
  <g transform="translate(60, 140)">
    <rect width="210" height="120" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="3"/>
    <rect x="15" y="15" width="180" height="30" rx="6" fill="#4f46e5"/>
    <text x="105" y="35" text-anchor="middle" class="label-title">RIVERSIDE CLUB</text>
    <text x="105" y="65" text-anchor="middle" class="label-sub">Kapacita: 2 200 osob (Covered)</text>
    <rect x="20" y="76" width="170" height="30" rx="6" fill="#0b0f19" stroke="#2d3748"/>
    <text x="105" y="95" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#818cf8">♿ Zpevněný bezbariérový vstup</text>
  </g>

  <!-- STAGE 3: Forum Hall (v3) -->
  <g transform="translate(620, 240)">
    <rect width="220" height="125" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="3"/>
    <rect x="15" y="15" width="190" height="30" rx="6" fill="#9333ea"/>
    <text x="110" y="35" text-anchor="middle" class="label-title">FORUM HALL</text>
    <text x="110" y="65" text-anchor="middle" class="label-sub">Kapacita: 1 300 osob (Sál / Indoor)</text>
    <rect x="20" y="78" width="180" height="32" rx="6" fill="#0b0f19" stroke="#2d3748"/>
    <text x="110" y="98" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#c084fc">♿ Výtah, rampa, indukční smyčka</text>
  </g>

  <!-- Central Plaza / Food & Chill Zone -->
  <g transform="translate(300, 260)">
    <rect width="260" height="110" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="130" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#f59e0b">GASTRO &amp; CHILL PLAZA</text>
    <text x="130" y="64" text-anchor="middle" class="label-sub">Bezhotovostní cashless zóna</text>
    <text x="130" y="84" text-anchor="middle" class="label-sub">Veganské, bezlepkové a lokální gastro</text>
  </g>

  <!-- ENTRANCE & LOGISTICS ICONS -->
  <!-- Main Entrance / Gates -->
  <g transform="translate(40, 440)">
    <rect width="180" height="60" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#10b981">HLAVNÍ VSTUP ZTP &amp; VŠICHNI</text>
    <text x="90" y="46" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Tram 6, 12, 17 | Metro Holešovice</text>
  </g>

  <!-- Parking P1 ZTP -->
  <g transform="translate(240, 440)">
    <rect width="140" height="60" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="28" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#38bdf8">PARKOVÁNÍ P1</text>
    <text x="70" y="46" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Vyhrazeno pro ZTP/P</text>
  </g>

  <!-- Info & First Aid -->
  <g transform="translate(400, 440)">
    <rect width="160" height="60" rx="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#f87171">INFO &amp; PRVNÍ POMOC</text>
    <text x="80" y="46" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Zdravotní služba ČČK 24/7</text>
  </g>

  <!-- WC Accessible -->
  <g transform="translate(580, 440)">
    <rect width="140" height="60" rx="8" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="2"/>
    <text x="70" y="28" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#a5b4fc">WC BEZBARIÉROVÉ</text>
    <text x="70" y="46" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Splachovací Euroklíč</text>
  </g>

  <!-- Legend -->
  <g transform="translate(740, 440)">
    <rect width="120" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="5" fill="#38bdf8"/>
    <text x="32" y="26" class="legend-text">Trasa pro vozík</text>
    <circle cx="20" cy="42" r="5" fill="#10b981"/>
    <text x="32" y="46" class="legend-text">Volný vstup</text>
  </g>
</svg>
