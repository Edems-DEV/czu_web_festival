  </g>
  <!-- Text Brand -->
  <text x="68" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#f8fafc" letter-spacing="2">AURORA</text>
  <text x="68" y="50" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="url(#auroraGrad)" letter-spacing="3.5">FESTIVAL 2026</text>
  <!-- City / Subtitle -->
  <text x="238" y="50" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" fill="#94a3b8" letter-spacing="1">PRAHA 7</text>
