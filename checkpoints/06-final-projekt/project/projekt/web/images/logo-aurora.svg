    <path d="M12 42 C 20 26, 28 20, 36 30 C 44 40, 50 26, 56 36" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85" fill="none"/>
    <circle cx="30" cy="12" r="3.5" fill="#38bdf8"/>
