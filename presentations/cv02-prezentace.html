<h2 id="4-vyu%C5%BEit%C3%AD-ai-a-odhalen%C3%A9-halucinace">4. Využití AI a odhalené halucinace</h2>

<h3 id="k-%C4%8Demu-jsme-ai-pou%C5%BEili">K čemu jsme AI použili:</h3>
<ul>
<li>Návrh základní kostry databáze 60 interpretů a anotací vystoupení.</li>
<li>Pomocné prompty pro formulaci uživatelských person a časové osy.</li>
</ul>
<h3 id="zji%C5%A1t%C4%9Bn%C3%A9-halucinace-a-chyby-ai">Zjištěné halucinace a chyby AI:</h3>

<li><strong>Časoprostorové kolize na pódiu:</strong> AI naplánovalo dvě různé kapely na <em>Main Stage</em> s překryvem 45 minut (kapela A končila v 12:45, kapela B začínala v 12:00).</li>
<li><strong>Neexistující ID vazeb:</strong> AI odkázalo program na <code>performerId: &quot;p61&quot;</code> v databázi o 60 položkách.</li>
<li><strong>Kontrastní faul:</strong> První AI návrh CSS obsahoval neonový text s kontrastním poměrem pouhých 2.8:1 (selhání WCAG AA).</li>
</ol>
